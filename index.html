<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9fafb;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background: #0070f3;
            color: white;
            gap: 1rem;
        }
        h1 {
            text-align: center;
            margin: 0;
        }
        .container {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }
        button {
            margin-top: 1rem;
            padding: 10px 16px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #005bb5;
        }
        pre {
            margin-top: 1rem;
            background: #f4f4f4;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }
        .footer {
            padding: 1rem;
            text-align: center;
            border-top: 1px solid #ddd;
            font-size: 14px;
        }
        .footer a {
            color: #0070f3;
            font-weight: bold;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer_powered {
            opacity: 0.7;
            font-size: 0.8em;
        }
        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                gap: 0.5rem;
            }
            .container {
                margin: 1rem;
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://formatjsononline.com/formatjsononline.png" alt="Format JSON Online" style="height: 30px; vertical-align: middle;">
        <h1>JSON Formatter</h1>
    </div>

    <div class="container">
        <textarea id="jsonInput">
{"id":1,"name":"Anil","skills":["React","Next.js","JSON"]}
        </textarea>
        <button onclick="formatJSON()">Format JSON</button>
        <pre id="output"></pre>
    </div>

    <div class="footer">
        🚀 Try the full tool →
        <a href="https://formatjsononline.com" target="_blank">Format JSON Online</a>
        <br />
        <small><a class="footer_powered" href="https://formatjsononline.com" target="_blank">Powered by Format JSON Online</a></small>
    </div>

    <script>
        function formatJSON() {
            const input = document.getElementById("jsonInput").value;
            const output = document.getElementById("output");
            try {
                const obj = JSON.parse(input);
                output.textContent = JSON.stringify(obj, null, 2);
            } catch (e) {
                output.textContent = "❌ Invalid JSON: " + e.message;
            }
        }
    </script>
</body>
</html>
